# Fanlight's default news feeds.
#
# Copy this file, edit it and point FANLIGHT_FEEDS at your copy (or pass --feeds).
# Feeds were checked to be live on 12 November 2026 (BBC science and business and
# Guardian sport by the same URL scheme as their checked sister feeds).
# Feeds move: `fanlight feeds` shows which ones are failing.
#
#   id        short unique name, used in logs and `fanlight feeds`
#   url       RSS 2.0, RSS 1.0 or Atom feed
#   outlet    the publisher's name as readers should see it
#   language  english or hindi (any language works; the tokenizer handles Latin and Devanagari)
#   category  default category; a story's own tags or URL path can refine it
#   reach     1 = national or international reach, 2 = large, 3 = niche. Feeds the outlet signal.
#
# Fanlight shows only the headline, the feed's own summary (trimmed) and image,
# and links every story back to the publisher. Check each publisher's terms
# before running a public service on top of their feeds.


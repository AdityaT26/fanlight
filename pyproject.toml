[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fanlight"
version = "2.0.0"
description = "Transparent, personalised news ranking with a web app."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Aditya Thakur" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
mongo = ["pymongo>=4.6"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "playwright>=1.45"]

[project.scripts]
fanlight = "fanlight.cli:main"

[tool.setuptools.packages.find]
include = ["fanlight*"]

[tool.setuptools.package-data]
fanlight = ["web/static/*", "web/static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]
